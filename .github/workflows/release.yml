name: Release
on:
  push:
    branches:
      - main
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            --package semantic-release@25.0.9 \
            --package conventional-changelog-conventionalcommits@9.3.1 \
            --package @semantic-release/changelog@7.0.0 \
            --package @semantic-release/exec@7.1.0 \
            --package @semantic-release/git@11.0.1 \
            semantic-release
